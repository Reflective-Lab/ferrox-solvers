syntax = "proto3";

package ferrox.v1;

option java_package = "zone.ferrox.v1";
option go_package   = "github.com/reflective-lab/ferrox/ferroxv1";

// ─── Shared ──────────────────────────────────────────────────────────────────

message StringF64 {
  string name  = 1;
  double value = 2;
}

message StringI64 {
  string name  = 1;
  int64  value = 2;
}

// ─── CP-SAT ──────────────────────────────────────────────────────────────────

message CpVariable {
  string name    = 1;
  int64  lb      = 2;
  int64  ub      = 3;
  bool   is_bool = 4;
}

message CpTerm {
  string var   = 1;
  int64  coeff = 2;
}

message CpLinear {
  repeated CpTerm terms = 1;
  int64           rhs   = 2;
}

message CpAllDifferent {
  repeated string vars = 1;
}

message CpBoolLiteral {
  string var     = 1;
  bool   negated = 2;
}

message CpBoolLiterals {
  repeated CpBoolLiteral literals = 1;
}

message CpImplication {
  CpBoolLiteral antecedent = 1;
  CpBoolLiteral consequent = 2;
}

message CpTuple {
  repeated int64 values = 1;
}

message CpAllowedAssignments {
  repeated string  vars   = 1;
  repeated CpTuple tuples = 2;
}

message CpIntervalVar {
  string name      = 1;
  string start_var = 2;
  int64  duration  = 3;
  string end_var   = 4;
}

message CpOptionalIntervalVar {
  string name      = 1;
  string start_var = 2;
  int64  duration  = 3;
  string end_var   = 4;
  string lit_var   = 5;
}

message CpNoOverlap {
  repeated string intervals = 1;
}

message CpCumulativeDemand {
  string interval = 1;
  int64  demand   = 2;
}

message CpCumulative {
  repeated CpCumulativeDemand demands = 1;
  int64                       capacity = 2;
}

message CpNoOverlap2DRectangle {
  string x_interval = 1;
  string y_interval = 2;
}

message CpNoOverlap2D {
  repeated CpNoOverlap2DRectangle rectangles = 1;
}

message CpConstraint {
  oneof kind {
    CpLinear             linear_le           = 1;
    CpLinear             linear_ge           = 2;
    CpLinear             linear_eq           = 3;
    CpAllDifferent       all_different       = 4;
    CpBoolLiterals       bool_or             = 5;
    CpBoolLiterals       bool_and            = 6;
    CpBoolLiterals       bool_xor            = 7;
    CpImplication        implication         = 8;
    CpBoolLiterals       at_most_one         = 9;
    CpBoolLiterals       exactly_one         = 10;
    CpAllowedAssignments allowed_assignments = 11;
    CpNoOverlap          no_overlap          = 12;
    CpCumulative         cumulative          = 13;
    CpNoOverlap2D        no_overlap_2d       = 14;
  }
}

message SolveCpRequest {
  string                         id                     = 1;
  repeated CpVariable            variables              = 2;
  repeated CpConstraint          constraints            = 3;
  repeated CpTerm                objective_terms        = 4;
  bool                           minimize               = 5;
  optional double                time_limit_seconds     = 6;
  repeated CpIntervalVar         interval_vars          = 7;
  repeated CpOptionalIntervalVar optional_interval_vars = 8;
}

message SolveCpResponse {
  string             request_id        = 1;
  string             status            = 2;
  repeated StringI64 assignments       = 3;
  optional int64     objective_value   = 4;
  double             wall_time_seconds = 5;
  string             solver            = 6;
}

// ─── LP (GLOP) ───────────────────────────────────────────────────────────────

message LpVariable {
  string name = 1;
  double lb   = 2;
  double ub   = 3;
}

message LpTerm {
  string var   = 1;
  double coeff = 2;
}

message LpConstraint {
  string          name  = 1;
  double          lb    = 2;
  double          ub    = 3;
  repeated LpTerm terms = 4;
}

message LpObjective {
  repeated LpTerm terms    = 1;
  bool            maximize = 2;
}

message SolveLpRequest {
  string              id                 = 1;
  repeated LpVariable variables          = 2;
  repeated LpConstraint constraints      = 3;
  LpObjective         objective          = 4;
  optional double     time_limit_seconds = 5;
}

message SolveLpResponse {
  string             request_id      = 1;
  string             status          = 2;
  repeated StringF64 values          = 3;
  double             objective_value = 4;
  string             solver          = 5;
}

// ─── MIP (HiGHS) ─────────────────────────────────────────────────────────────

enum VarKind {
  CONTINUOUS = 0;
  INTEGER    = 1;
  BINARY     = 2;
}

message MipVariable {
  string  name = 1;
  double  lb   = 2;
  double  ub   = 3;
  VarKind kind = 4;
}

message MipTerm {
  string var   = 1;
  double coeff = 2;
}

message MipConstraint {
  string           name  = 1;
  double           lb    = 2;
  double           ub    = 3;
  repeated MipTerm terms = 4;
}

message MipObjective {
  repeated MipTerm terms    = 1;
  bool             maximize = 2;
}

message SolveMipRequest {
  string               id                  = 1;
  repeated MipVariable variables           = 2;
  repeated MipConstraint constraints       = 3;
  MipObjective         objective           = 4;
  optional double      time_limit_seconds  = 5;
  optional double      mip_gap_tolerance   = 6;
}

message SolveMipResponse {
  string             request_id      = 1;
  string             status          = 2;
  repeated StringF64 values          = 3;
  double             objective_value = 4;
  double             mip_gap         = 5;
  string             solver          = 6;
}

// ─── Service ─────────────────────────────────────────────────────────────────

service FerroxSolver {
  rpc SolveCp  (SolveCpRequest)  returns (SolveCpResponse);
  rpc SolveLp  (SolveLpRequest)  returns (SolveLpResponse);
  rpc SolveMip (SolveMipRequest) returns (SolveMipResponse);
}
