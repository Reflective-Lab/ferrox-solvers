[workspace]

[package]
name = "maatw"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "maatw"
path = "src/main.rs"

[dependencies]
ferrox       = { path = "../../crates/ferrox", package = "converge-ferrox-solver", features = ["ortools"] }
converge-core = "3.9.2"
converge-pack = "3.9.2"
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
