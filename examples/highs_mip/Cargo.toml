[workspace]

[package]
name = "highs-mip"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "highs_mip"
path = "src/main.rs"

[dependencies]
ferrox        = { path = "../../crates/ferrox", package = "converge-ferrox-solver", features = ["highs"] }
converge-core = "3.8.1"
converge-pack = "3.8.1"
tokio         = { version = "1", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
converge-core = { path = "../../../../bedrock-platform/converge/crates/core" }
converge-model = { path = "../../../../bedrock-platform/converge/crates/model" }
converge-pack = { path = "../../../../bedrock-platform/converge/crates/pack" }
converge-provider = { path = "../../../../bedrock-platform/converge/crates/provider" }
