name: Stability

on:
  schedule:
    # Weekly Monday morning (6am UTC = 7am London)
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.96.0"
  # ferrox-server links against the OR-Tools C++ build, which CI does
  # not provision. Mirror the EXCLUDES used by ci.yml / coverage.yml.
  EXCLUDES: --exclude converge-ferrox-server

jobs:
  bench-compile:
    name: Benchmarks (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Ensure benchmarks compile
        run: cargo bench --workspace ${{ env.EXCLUDES }} --no-run

  bench-run:
    name: Benchmarks (execute)
    runs-on: ubuntu-latest
    needs: bench-compile
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: cargo bench --workspace ${{ env.EXCLUDES }}
      - name: Extract baseline data
        if: always()
        run: |
          if [ -f scripts/extract-criterion-baseline.py ]; then
            python3 scripts/extract-criterion-baseline.py || echo "Baseline extraction failed"
          fi
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-reports
          path: target/criterion/
      - name: Upload baseline data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-data
          path: kb/Baselines/

  soak:
    name: Soak Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Run soak tests
        env:
          SOAK_CYCLES: "1000"
          SOAK_CONCURRENCY: "100"
          SOAK_ITERATIONS: "200"
        run: cargo test --workspace ${{ env.EXCLUDES }} -- --include-ignored soak

  security-blocking:
    name: Security Audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo-audit (blocking)
        run: cargo audit --deny warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Reflective sibling dependencies
        run: bash scripts/ci/checkout-reflective-siblings.sh
      # Not EmbarkStudios/cargo-deny-action: its docker container can't
      # install the repo's pinned musl toolchain and doesn't see the
      # sibling checkouts, so `cargo metadata` fails on converge-core.
      # Run cargo-deny in the runner env like the audit job above.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        run: cargo deny check
