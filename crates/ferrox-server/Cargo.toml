[package]
name          = "converge-ferrox-server"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
license.workspace    = true
repository.workspace = true
publish       = false
description   = "gRPC server exposing ferrox solvers (CP-SAT, GLOP, HiGHS)"

[lib]
name = "converge_ferrox_server"
path = "src/lib.rs"

[[bin]]
name = "ferrox-server"
path = "src/main.rs"

[features]
default = ["full"]
full    = ["dep:ferrox-ortools-sys", "dep:ferrox-highs-sys",
           "ferrox/full", "ferrox-ortools-sys/link", "ferrox-highs-sys/link"]

[dependencies]
ferrox               = { workspace = true }
ferrox-ortools-sys   = { workspace = true, optional = true }
ferrox-highs-sys     = { workspace = true, optional = true }

tonic                = { version = "0.14", features = ["tls-ring"] }
tonic-prost          = "0.14"
tonic-health         = "0.14"
prost                = "0.14"
tokio                = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { version = "0.3.23", features = ["env-filter", "json"] }
anyhow               = "1"
uuid                 = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
serial_test = "3"
temp-env    = "0.3"

[lints]
workspace = true
